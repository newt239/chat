/api/users/me:
  get:
    operationId: getMe
    summary: Get current user profile
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Current user profile
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/MeProfile"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  patch:
    operationId: updateMe
    summary: Update current user profile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdateMeRequest"
    responses:
      "200":
        description: User profile updated
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/MeProfile"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    operationId: deleteMe
    summary: Delete current user account
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Account deleted
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SuccessResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
