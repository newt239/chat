/api/messages/{messageId}/follow:
  post:
    operationId: followThread
    summary: Follow a thread
    security:
      - bearerAuth: []
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Thread followed
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SuccessResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Message not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    operationId: unfollowThread
    summary: Unfollow a thread
    security:
      - bearerAuth: []
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Thread unfollowed
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SuccessResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Message not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
