MessageLink:
  type: object
  properties:
    id:
      type: string
      format: uuid
    url:
      type: string
    title:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    imageUrl:
      type: string
      nullable: true
    siteName:
      type: string
      nullable: true
    cardType:
      type: string
      nullable: true
  required:
    - id
    - url
