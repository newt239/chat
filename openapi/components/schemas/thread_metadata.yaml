ThreadMetadata:
  type: object
  properties:
    messageId:
      type: string
      format: uuid
    replyCount:
      type: integer
      minimum: 0
    lastReplyAt:
      type: string
      format: date-time
      nullable: true
    lastReplyUser:
      allOf:
        - $ref: "../../openapi.yaml#/components/schemas/MessageUser"
      nullable: true
    participantUserIds:
      type: array
      items:
        type: string
        format: uuid
  required:
    - messageId
    - replyCount
    - participantUserIds

