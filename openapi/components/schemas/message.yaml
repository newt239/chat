Message:
  type: object
  properties:
    id:
      type: string
      format: uuid
    channelId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    parentId:
      type: string
      format: uuid
      nullable: true
    body:
      type: string
    createdAt:
      type: string
      format: date-time
    editedAt:
      type: string
      format: date-time
      nullable: true
    deletedAt:
      type: string
      format: date-time
      nullable: true
    isDeleted:
      type: boolean
    deletedBy:
      allOf:
        - $ref: "../../openapi.yaml#/components/schemas/MessageUser"
      nullable: true
    user:
      $ref: "../../openapi.yaml#/components/schemas/MessageUser"
    mentions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/UserMention"
    groups:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/GroupMention"
    links:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/MessageLink"
    reactions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReactionInfo"
    attachments:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/MessageAttachment"
  required:
    - id
    - channelId
    - userId
    - user
    - body
    - createdAt
    - isDeleted
