SystemMessage:
  type: object
  properties:
    id:
      type: string
      format: uuid
    channelId:
      type: string
      format: uuid
    kind:
      type: string
      description: "member_joined / member_added / member_removed / member_left / channel_name_changed / channel_description_changed / channel_privacy_changed / message_pinned"
    payload:
      type: object
      additionalProperties: true
    actorId:
      type: string
      format: uuid
      nullable: true
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - channelId
    - kind
    - payload
    - createdAt
