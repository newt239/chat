TimelineItem:
  type: object
  properties:
    type:
      type: string
      enum: [user, system]
    userMessage:
      $ref: "../../openapi.yaml#/components/schemas/Message"
    systemMessage:
      $ref: "../../openapi.yaml#/components/schemas/SystemMessage"
    createdAt:
      type: string
      format: date-time
  required:
    - type
    - createdAt
