packages:
  - frontend
  - backend
  - packages/*

saveExact: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - pnpm
  - "@pnpm/exe.*"

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11

allowBuilds:
  "@bufbuild/buf": false
  core-js: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
  lefthook: true
  sharp: true
  "@firebase/util": false
