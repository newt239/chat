version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"

  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/frontend/src-tauri/gen/android"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    # Tauri のテンプレートと crate は Gradle 9 と Kotlin 2 で使えない API に依存するため、Tauri が対応するまでメジャー更新を止める
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"
