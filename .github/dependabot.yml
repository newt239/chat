version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"

  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"

  - package-ecosystem: "cargo"
    directory: "/frontend/src-tauri"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/frontend/src-tauri/gen/android"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
      time: "08:00"
    cooldown:
      default-days: 7
    target-branch: "main"
    # Tauri のテンプレートと crate は Gradle 8・Kotlin 1.9 前提で、AndroidX のマイナー更新でも Kotlin 2 系が要求されて壊れるため、パッチ更新だけにする
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      all-dependencies:
        patterns:
          - "*"
