apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # WebSocket の配信は Redis で共有するため、Spot の回収に備えて 2 台を別ノードに置く
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: chat-backend
      # 停止時は readiness を落として 5 秒待ち、WebSocket を閉じ終えるまで最大 40 秒待つ
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      initContainers:
        # restartPolicy: Always でネイティブサイドカーとして動かし、backend より先に起動させる
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.0
          restartPolicy: Always
          args:
            - --private-ip
            - --structured-logs
            - --health-check
            - --http-address=0.0.0.0
            - --port=5432
            - CLOUDSQL_CONNECTION_NAME
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /liveness
              port: 9090
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: backend
          image: backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-env
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          # CPU は制限せず、メモリだけ上限を付けてノードを守る
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
