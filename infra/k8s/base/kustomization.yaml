apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - identity.yaml
  - backend.yaml
  - frontend.yaml
  - meilisearch.yaml
  - redis.yaml
  - cloudflared.yaml

configMapGenerator:
  - name: backend-env
    literals:
      - ENV=production
      - PORT=8080
      - STORAGE_DRIVER=wasabi
      - WASABI_ENDPOINT=https://s3.ap-northeast-1.wasabisys.com
      - WASABI_REGION=ap-northeast-1
      - MEILISEARCH_URL=http://meilisearch:7700
      - REDIS_URL=redis://redis:6379
