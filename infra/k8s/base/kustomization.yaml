apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - identity.yaml
  - backend.yaml
  - frontend.yaml
  - meilisearch.yaml
  - ingress.yaml

configMapGenerator:
  - name: backend-env
    literals:
      - ENV=production
      - PORT=8080
      - STORAGE_DRIVER=wasabi
      # GCS の S3 互換 (XML) API
      - WASABI_ENDPOINT=https://storage.googleapis.com
      - WASABI_REGION=auto
      - MEILISEARCH_URL=http://meilisearch:7700
