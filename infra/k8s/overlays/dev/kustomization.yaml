apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chat-dev

resources:
  - ../../base
  - params.yaml

components:
  - ../../components/gke

# deploy ワークフローが kustomize edit set image でタグを書き換える
images:
  - name: backend
    newName: asia-northeast1-docker.pkg.dev/your-gcp-project-id/chat/backend
    newTag: latest
  - name: frontend
    newName: asia-northeast1-docker.pkg.dev/your-gcp-project-id/chat/frontend
    newTag: latest

configMapGenerator:
  - name: backend-env
    behavior: merge
    literals:
      # アイコン画像の配信 URL に使う backend の公開 URL
      - PUBLIC_BASE_URL=https://api-chat-dev.example.com
      - CORS_ALLOWED_ORIGINS=https://chat-dev.example.com,tauri://localhost,https://tauri.localhost
      - WASABI_BUCKET=example-chat-dev-attachments
      - GOOGLE_OAUTH_CLIENT_ID=
      - FIREBASE_PROJECT_ID=your-gcp-project-id
      - PASSWORD_AUTH_ENABLED=true
