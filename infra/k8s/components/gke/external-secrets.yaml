# Secret Manager の値を External Secrets Operator で k8s の Secret に同期する
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: CLUSTER_LOCATION
          clusterName: CLUSTER_NAME
          clusterProjectID: PROJECT_ID
          serviceAccountRef:
            name: chat-backend
---
# remoteRef.key の先頭の ENV は overlay で環境名に置き換える（Secret Manager の ID は <環境>-<変数名>）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: backend-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: ENV-DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: ENV-JWT_SECRET
    - secretKey: MEILISEARCH_API_KEY
      remoteRef:
        key: ENV-MEILISEARCH_API_KEY
    - secretKey: WASABI_ACCESS_KEY_ID
      remoteRef:
        key: ENV-WASABI_ACCESS_KEY_ID
    - secretKey: WASABI_SECRET_ACCESS_KEY
      remoteRef:
        key: ENV-WASABI_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: cloudflared-token
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: ENV-CLOUDFLARE_TUNNEL_TOKEN
