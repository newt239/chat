pre-commit:
  # lint の修正結果を format が整形するため逐次実行する
  parallel: false
  commands:
    1_lint:
      glob: "frontend/**/*.{ts,tsx}"
      run: pnpm --filter chat-frontend run lint:fix
      stage_fixed: true
      fail_text: リントエラーがあります
    2_format:
      glob: "frontend/**/*.{ts,tsx,json}"
      run: pnpm --filter chat-frontend run format:fix
      stage_fixed: true
      fail_text: フォーマットエラーがあります
    3_packages_lint:
      glob: "packages/**/*.ts"
      run: pnpm --filter "./packages/*" run lint:fix
      stage_fixed: true
      fail_text: リントエラーがあります
    4_packages_format:
      glob: "packages/**/*.{ts,json}"
      run: pnpm --filter "./packages/*" run format:fix
      stage_fixed: true
      fail_text: フォーマットエラーがあります
# Go のリントはコンテナ起動が前提のため CI の backend ジョブで担保する
