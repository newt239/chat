syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "chat/v1/user.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc DeleteMe(DeleteMeRequest) returns (DeleteMeResponse);
  rpc GetUserNote(GetUserNoteRequest) returns (GetUserNoteResponse);
  rpc UpdateUserNote(UpdateUserNoteRequest) returns (UpdateUserNoteResponse);
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UpdateMeRequest {
  optional string display_name = 1 [(buf.validate.field).string.min_len = 1];
  optional string bio = 2;
  // 空文字はアバターを外す
  optional string avatar_url = 3 [
    (buf.validate.field).string.max_len = 2048,
    (buf.validate.field).cel = {
      id: "uri_or_empty"
      message: "URL か空文字を指定してください"
      expression: "this == '' || this.isUri()"
    }
  ];
  // 指定したときだけ丸ごと置き換える。空の urls はリンクをすべて外す
  ProfileLinks links = 4;
}

message UpdateMeResponse {
  User user = 1;
}

message UpdatePreferencesRequest {
  UserPreferences preferences = 1 [(buf.validate.field).required = true];
}

message UpdatePreferencesResponse {
  UserPreferences preferences = 1;
}

message UpdatePasswordRequest {
  string current_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 8];
}

message UpdatePasswordResponse {}

message DeleteMeRequest {}

message DeleteMeResponse {}

// 自分だけに見える相手ユーザーのニックネームとメモ
message UserNote {
  string target_user_id = 1;
  optional string nickname = 2;
  optional string memo = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetUserNoteRequest {
  string target_user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserNoteResponse {
  // 未設定の場合は空
  UserNote note = 1;
}

message UpdateUserNoteRequest {
  string target_user_id = 1 [(buf.validate.field).string.uuid = true];
  // 空文字で削除する
  string nickname = 2 [(buf.validate.field).string.max_len = 50];
  string memo = 3 [(buf.validate.field).string.max_len = 2000];
}

message UpdateUserNoteResponse {
  UserNote note = 1;
}
