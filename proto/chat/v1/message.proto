syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "chat/v1/user.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Message {
  string id = 1;
  string channel_id = 2;
  string user_id = 3;
  UserSummary user = 4;
  optional string parent_id = 5;
  string body = 6;
  repeated UserMention mentions = 7;
  repeated GroupMention groups = 8;
  repeated MessageLink links = 9;
  repeated Reaction reactions = 10;
  repeated MessageAttachment attachments = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp edited_at = 13;
  google.protobuf.Timestamp deleted_at = 14;
  bool is_deleted = 15;
  UserSummary deleted_by = 16;
  // スレッド付きの一覧取得でのみ設定される
  ThreadMetadata thread_metadata = 17;
  // ピン留めされている場合のみ設定される
  MessagePin pin = 18;
  // 位置情報を共有したメッセージのみ設定される
  MessageLocation location = 19;
}

message MessageLocation {
  double latitude = 1 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];
  double longitude = 2 [(buf.validate.field).double = {
    gte: -180
    lte: 180
  }];
  // 測位の誤差（メートル）
  optional double accuracy_meters = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 100000
  }];
  optional string label = 4 [(buf.validate.field).string.max_len = 100];
}

message MessagePin {
  UserSummary pinned_by = 1;
  google.protobuf.Timestamp pinned_at = 2;
}

message UserMention {
  string user_id = 1;
  string display_name = 2;
}

message GroupMention {
  string group_id = 1;
  string name = 2;
}

message MessageLink {
  string id = 1;
  string url = 2;
  // 同じワークスペースのメッセージへのリンクでは OGP を取得しないため空になる
  OgpData ogp = 3;
  // 同じワークスペースのメッセージへのリンクのときに設定される
  optional string linked_message_id = 4;
  // linked_message_id のメッセージを閲覧者が参照できる場合のみ設定される。WebSocket のイベントには含めない
  MessagePreview message_preview = 5;
}

message OgpData {
  optional string title = 1;
  optional string description = 2;
  optional string image_url = 3;
  optional string site_name = 4;
  optional string card_type = 5;
  optional int32 image_width = 6;
  optional int32 image_height = 7;
  // YouTube の動画 URL のときのみ設定される
  YouTubeVideo youtube = 8;
}

message YouTubeVideo {
  string video_id = 1;
  optional string channel_name = 2;
  optional int32 duration_seconds = 3;
}

// メッセージリンクを引用カードとして展開するための情報
message MessagePreview {
  string message_id = 1;
  string channel_id = 2;
  string channel_name = 3;
  optional string parent_id = 4;
  UserSummary user = 5;
  // 先頭の一部だけを返す
  string body_excerpt = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Reaction {
  string message_id = 1;
  UserSummary user = 2;
  string emoji = 3;
  google.protobuf.Timestamp created_at = 4;
}

message MessageAttachment {
  string id = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  MediaMetadata media = 5;
}

// 画像・動画・音声の表示に使うメタデータ。アップロード時にクライアントが計測した値
message MediaMetadata {
  optional int32 width = 1;
  optional int32 height = 2;
  optional double duration_seconds = 3;
  // 動画の再生前に表示するサムネイル。画像は GetDownloadUrl の thumbnail で取得する
  MediaThumbnail thumbnail = 4;
}

message MediaThumbnail {
  int32 width = 1;
  int32 height = 2;
}

message ThreadMetadata {
  string message_id = 1;
  int32 reply_count = 2;
  google.protobuf.Timestamp last_reply_at = 3;
  UserSummary last_reply_user = 4;
  repeated string participant_user_ids = 5;
}

enum SystemMessageKind {
  SYSTEM_MESSAGE_KIND_UNSPECIFIED = 0;
  SYSTEM_MESSAGE_KIND_MEMBER_JOINED = 1;
  SYSTEM_MESSAGE_KIND_MEMBER_ADDED = 2;
  SYSTEM_MESSAGE_KIND_MEMBER_REMOVED = 3;
  SYSTEM_MESSAGE_KIND_MEMBER_LEFT = 4;
  SYSTEM_MESSAGE_KIND_CHANNEL_PRIVACY_CHANGED = 5;
  SYSTEM_MESSAGE_KIND_CHANNEL_NAME_CHANGED = 6;
  SYSTEM_MESSAGE_KIND_CHANNEL_DESCRIPTION_CHANGED = 7;
  SYSTEM_MESSAGE_KIND_MESSAGE_PINNED = 8;
}

message SystemMessage {
  string id = 1;
  string channel_id = 2;
  SystemMessageKind kind = 3;
  // kind ごとに内容が異なるため構造を固定しない
  google.protobuf.Struct payload = 4;
  optional string actor_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ユーザーメッセージとシステムメッセージを時系列で並べるための項目
message TimelineItem {
  oneof content {
    Message user_message = 1;
    SystemMessage system_message = 2;
  }
  google.protobuf.Timestamp created_at = 3;
}
