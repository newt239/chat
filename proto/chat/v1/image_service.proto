syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";

// アイコン画像のアップロード。upload_url に PUT してから、image_url をユーザー・ワークスペース・アプリの更新に渡す
service ImageService {
  rpc PresignImageUpload(PresignImageUploadRequest) returns (PresignImageUploadResponse);
}

enum ImagePurpose {
  IMAGE_PURPOSE_UNSPECIFIED = 0;
  IMAGE_PURPOSE_AVATAR = 1;
  IMAGE_PURPOSE_WORKSPACE_ICON = 2;
  IMAGE_PURPOSE_APP_ICON = 3;
}

message PresignImageUploadRequest {
  ImagePurpose purpose = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // WORKSPACE_ICON と APP_ICON のときに指定する
  string workspace_id = 2;
  string content_type = 3 [(buf.validate.field).string = {
    in: [
      "image/png",
      "image/jpeg",
      "image/webp"
    ]
  }];
  int64 size_bytes = 4 [(buf.validate.field).int64 = {
    gt: 0
    lte: 1048576
  }];
}

message PresignImageUploadResponse {
  string upload_url = 1;
  // 期限のない配信用の URL
  string image_url = 2;
}
