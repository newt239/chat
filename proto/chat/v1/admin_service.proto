syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "chat/v1/user.proto";
import "chat/v1/workspace_service.proto";
import "google/protobuf/timestamp.proto";

// ワークスペースの管理画面の API。すべて owner / admin だけが呼び出せる
service AdminService {
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  // 絞り込んだ監査ログを CSV で返す。データのエクスポート権限も必要で、書き出したこと自体も監査ログに残る
  rpc ExportAuditLogs(ExportAuditLogsRequest) returns (ExportAuditLogsResponse);
  rpc ListAdminMembers(ListAdminMembersRequest) returns (ListAdminMembersResponse);
  // 停止するとリフレッシュトークンを失効させ、以降そのワークスペースの API を拒否する。投稿は残る
  rpc SuspendMember(SuspendMemberRequest) returns (SuspendMemberResponse);
  rpc ResumeMember(ResumeMemberRequest) returns (ResumeMemberResponse);
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_LOGIN = 1;
  AUDIT_ACTION_LOGIN_FAILED = 2;
  AUDIT_ACTION_MEMBER_ROLE_CHANGED = 3;
  AUDIT_ACTION_MEMBER_SUSPENDED = 4;
  AUDIT_ACTION_MEMBER_RESUMED = 5;
  AUDIT_ACTION_CHANNEL_CREATED = 6;
  AUDIT_ACTION_CHANNEL_DELETED = 7;
  AUDIT_ACTION_CHANNEL_ARCHIVED = 8;
  AUDIT_ACTION_CHANNEL_UNARCHIVED = 9;
  AUDIT_ACTION_PERMISSION_CHANGED = 10;
  AUDIT_ACTION_DATA_EXPORTED = 11;
  AUDIT_ACTION_WEBHOOK_CREATED = 12;
  AUDIT_ACTION_WEBHOOK_DELETED = 13;
}

message AuditLog {
  string id = 1;
  // ログインの失敗など実行者を特定できない場合は空
  optional UserSummary actor = 2;
  AuditAction action = 3;
  // user / channel / role / data / webhook
  string target_type = 4;
  string target_id = 5;
  // 記録時点の対象の名前（ユーザーの表示名、チャンネル名、ロール名など）
  string target_label = 6;
  // 操作ごとの詳細。ロール変更は from / to、権限変更は permission / allowed、エクスポートは kind / format / count
  map<string, string> metadata = 7;
  string ip_address = 8;
  string user_agent = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListAuditLogsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string actor_id = 2 [(buf.validate.field).string.uuid = true];
  // 空の場合はすべての種類
  repeated AuditAction actions = 3 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  optional google.protobuf.Timestamp since = 4;
  optional google.protobuf.Timestamp until = 5;
  // 未指定 (0) の場合は 50 件
  int32 limit = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  int32 offset = 7 [(buf.validate.field).int32.gte = 0];
}

message ListAuditLogsResponse {
  // 新しい順
  repeated AuditLog logs = 1;
  // ページングを無視した件数
  int32 total_count = 2;
}

message ExportAuditLogsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string actor_id = 2 [(buf.validate.field).string.uuid = true];
  repeated AuditAction actions = 3 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  optional google.protobuf.Timestamp since = 4;
  optional google.protobuf.Timestamp until = 5;
}

message ExportAuditLogsResponse {
  // BOM 付き UTF-8 の CSV（最大 10,000 件）
  string content = 1;
  string file_name = 2;
}

message AdminMember {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  optional string avatar_url = 4;
  WorkspaceRole role = 5;
  google.protobuf.Timestamp joined_at = 6;
  // 停止中の場合だけ設定される
  optional google.protobuf.Timestamp suspended_at = 7;
  optional google.protobuf.Timestamp last_login_at = 8;
  string last_login_ip = 9;
  string last_login_user_agent = 10;
  // 2 段階認証は未実装のため常に false
  bool two_factor_enabled = 11;
  // 直近 30 日の投稿数
  int32 recent_message_count = 12;
  // アップロードした添付ファイルの合計サイズ
  int64 storage_bytes = 13;
  optional google.protobuf.Timestamp last_message_at = 14;
}

message ListAdminMembersRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListAdminMembersResponse {
  repeated AdminMember members = 1;
}

message SuspendMemberRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message SuspendMemberResponse {}

message ResumeMemberRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message ResumeMemberResponse {}
