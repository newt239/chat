syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "chat/v1/message.proto";

// 入力欄の「/」から始まるコマンド (/remind [me|<@ユーザーID>|<#チャンネルID>] 内容 日時)。応答は公式アプリが投稿する
service CommandService {
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}

message ExecuteCommandRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  // スレッドの入力欄から実行したときの親メッセージ。応答をスレッドに返す
  optional string parent_id = 2 [(buf.validate.field).string.uuid = true];
  string text = 3 [(buf.validate.field).string = {
    pattern: "^/"
    max_len: 4000
  }];
}

message ExecuteCommandResponse {
  // 公式アプリの応答
  Message message = 1;
}
