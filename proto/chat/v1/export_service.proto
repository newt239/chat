syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";

// ワークスペースのデータの書き出し。権限設定の「データのエクスポート」が必要で、書き出しは監査ログに残る
service ExportService {
  // 書き出す人が閲覧できるチャンネル（DM を除く）の削除されていないメッセージを JSON で返す
  rpc ExportMessages(ExportMessagesRequest) returns (ExportMessagesResponse);
}

message ExportMessagesRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ExportMessagesResponse {
  string content = 1;
  string file_name = 2;
}
