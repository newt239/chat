syntax = "proto3";

package chat.v1;

import "chat/v1/message.proto";
import "chat/v1/user.proto";
import "google/protobuf/timestamp.proto";

// WebSocket でクライアントからサーバーへ送るイベント
message ClientEvent {
  oneof event {
    ChannelEvent join_channel = 1;
    ChannelEvent leave_channel = 2;
    ChannelEvent typing = 3;
    ChannelEvent stop_typing = 4;
    // 閲覧中のチャンネルを通知する。channel_id が空なら閲覧をやめたことを表す
    ChannelEvent view_channel = 5;
  }
}

message ChannelEvent {
  string channel_id = 1;
}

// WebSocket でサーバーからクライアントへ送るイベント
message ServerEvent {
  oneof event {
    MessageEvent new_message = 1;
    MessageEvent message_updated = 2;
    MessageDeletedEvent message_deleted = 3;
    UnreadCountEvent unread_count = 4;
    PinEvent pin_created = 5;
    PinEvent pin_deleted = 6;
    SystemMessageEvent system_message_created = 7;
    ReactionEvent reaction_added = 8;
    ReactionEvent reaction_removed = 9;
    TypingEvent typing = 10;
    TypingEvent stop_typing = 11;
    ChannelViewersEvent channel_viewers = 14;
    // ワークスペースの全員に送る。一覧を取り直すきっかけにする
    CustomEmojiEvent custom_emoji_created = 15;
    CustomEmojiEvent custom_emoji_deleted = 16;
  }
}

message MessageEvent {
  string channel_id = 1;
  Message message = 2;
}

message MessageDeletedEvent {
  string channel_id = 1;
  string message_id = 2;
  // 親メッセージと一緒に削除されたスレッド返信も含む
  repeated string deleted_message_ids = 3;
}

message UnreadCountEvent {
  string channel_id = 1;
  int32 unread_count = 2;
  int32 mention_count = 4;
}

message PinEvent {
  string channel_id = 1;
  string message_id = 2;
  string pinned_by = 3;
  google.protobuf.Timestamp pinned_at = 4;
  // pin_created のときのみ設定される
  UserSummary pinned_by_user = 5;
}

message SystemMessageEvent {
  string channel_id = 1;
  SystemMessage message = 2;
}

message ReactionEvent {
  string channel_id = 1;
  string message_id = 2;
  string user_id = 3;
  string emoji = 4;
  // reaction_added のときのみ設定される
  UserSummary user = 5;
  google.protobuf.Timestamp created_at = 6;
}

message TypingEvent {
  string channel_id = 1;
  string user_id = 2;
}

// チャンネルを閲覧中のユーザー一覧
message ChannelViewersEvent {
  string channel_id = 1;
  repeated string user_ids = 2;
}

// カスタム絵文字の登録・削除
message CustomEmojiEvent {
  string workspace_id = 1;
  string emoji_id = 2;
  string name = 3;
}
