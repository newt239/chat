syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "chat/v1/message.proto";

service LinkService {
  rpc FetchOgp(FetchOgpRequest) returns (FetchOgpResponse);
}

message FetchOgpRequest {
  string url = 1 [(buf.validate.field).string.uri = true];
}

message FetchOgpResponse {
  OgpData ogp = 1;
}
