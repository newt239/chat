syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service AttachmentService {
  rpc PresignUpload(PresignUploadRequest) returns (PresignUploadResponse);
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
}

message PresignUploadRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string file_name = 2 [(buf.validate.field).string.min_len = 1];
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
  int64 size_bytes = 4 [(buf.validate.field).int64.gt = 0];
  // 画像・動画・音声のときにクライアントが計測した値を送る
  optional int32 width = 5 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100000
  }];
  optional int32 height = 6 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100000
  }];
  optional double duration_seconds = 7 [(buf.validate.field).double = {
    gte: 0
    lte: 86400
  }];
  // 動画のときにクライアントが切り出したサムネイル画像。指定すると画像用のアップロード URL も返す
  ThumbnailUpload thumbnail = 8;
}

message ThumbnailUpload {
  string content_type = 1 [(buf.validate.field).string = {
    in: [
      "image/jpeg",
      "image/png",
      "image/webp"
    ]
  }];
  int64 size_bytes = 2 [(buf.validate.field).int64 = {
    gt: 0
    lte: 5242880
  }];
  int32 width = 3 [(buf.validate.field).int32 = {
    gt: 0
    lte: 4096
  }];
  int32 height = 4 [(buf.validate.field).int32 = {
    gt: 0
    lte: 4096
  }];
}

message PresignUploadResponse {
  string attachment_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  optional string thumbnail_upload_url = 4;
}

message GetDownloadUrlRequest {
  string attachment_id = 1 [(buf.validate.field).string.uuid = true];
  // true のときは本体ではなくサムネイル画像の URL を返す。サムネイルがなければ NotFound
  bool thumbnail = 2;
}

message GetDownloadUrlResponse {
  string url = 1;
  int32 expires_in = 2;
}
