syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service AttachmentService {
  rpc PresignUpload(PresignUploadRequest) returns (PresignUploadResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse);
}

message Attachment {
  string id = 1;
  optional string message_id = 2;
  string uploader_id = 3;
  string channel_id = 4;
  string file_name = 5;
  string mime_type = 6;
  int64 size_bytes = 7 [jstype = JS_NUMBER];
  string status = 8;
  google.protobuf.Timestamp created_at = 9;
}

message PresignUploadRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  string file_name = 2 [(buf.validate.field).string.min_len = 1];
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
  int64 size_bytes = 4 [
    jstype = JS_NUMBER,
    (buf.validate.field).int64.gt = 0
  ];
}

message PresignUploadResponse {
  string attachment_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetAttachmentRequest {
  string attachment_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAttachmentResponse {
  Attachment attachment = 1;
}

message GetDownloadUrlRequest {
  string attachment_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetDownloadUrlResponse {
  string url = 1;
  int32 expires_in = 2;
}

message DeleteAttachmentRequest {
  string attachment_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteAttachmentResponse {}
