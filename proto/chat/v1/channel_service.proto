syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service ChannelService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc SetChannelStarred(SetChannelStarredRequest) returns (SetChannelStarredResponse);
  // 自分だけに効くミュート。通知の抑制はクライアントが is_muted を見て行う
  rpc SetChannelMuted(SetChannelMutedRequest) returns (SetChannelMutedResponse);
  // チャンネルの作成者かワークスペースの管理者が実行できる。アーカイブ中は投稿できない
  rpc ArchiveChannel(ArchiveChannelRequest) returns (ArchiveChannelResponse);
  rpc UnarchiveChannel(UnarchiveChannelRequest) returns (UnarchiveChannelResponse);
}

message Channel {
  string id = 1;
  string workspace_id = 2;
  // スラッシュ区切りのフルパス (例: dev/frontend)
  string name = 3;
  optional string description = 4;
  bool is_private = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int32 unread_count = 9;
  bool has_mention = 10;
  optional string parent_id = 11;
  bool is_starred = 12;
  // false の場合はツリーを組み立てるために返している未参加の祖先チャンネル
  bool is_member = 13;
  // アーカイブ中の場合だけ設定される
  optional google.protobuf.Timestamp archived_at = 14;
  bool is_muted = 15;
}

message ListChannelsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message CreateChannelRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  // 存在しない親は自動で作成する
  string name = 2 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^[\\p{L}\\p{N}_-]{1,32}(/[\\p{L}\\p{N}_-]{1,32}){0,3}$"
  }];
  optional string description = 3;
  bool is_private = 4;
  // 作成者以外に参加させるユーザー
  repeated string member_ids = 5 [(buf.validate.field).repeated.items.string.uuid = true];
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelResponse {
  Channel channel = 1;
}

message UpdateChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  // 変更できるのは末尾のセグメントのみ
  optional string name = 2 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^[\\p{L}\\p{N}_-]{1,32}(/[\\p{L}\\p{N}_-]{1,32}){0,3}$"
  }];
  optional string description = 3;
  optional bool is_private = 4;
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteChannelResponse {}

message SetChannelStarredRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool starred = 2;
}

message SetChannelStarredResponse {}

message SetChannelMutedRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool muted = 2;
}

message SetChannelMutedResponse {}

message ArchiveChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message ArchiveChannelResponse {
  Channel channel = 1;
}

message UnarchiveChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message UnarchiveChannelResponse {
  Channel channel = 1;
}
