syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service ChannelService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc SetChannelStarred(SetChannelStarredRequest) returns (SetChannelStarredResponse);
  // 自分だけに効くミュート。通知の抑制はクライアントが is_muted を見て行う
  rpc SetChannelMuted(SetChannelMutedRequest) returns (SetChannelMutedResponse);
  // 参加していなくても閲覧できるチャンネル（公開と参加中の非公開）をすべて返す
  rpc ListBrowsableChannels(ListBrowsableChannelsRequest) returns (ListBrowsableChannelsResponse);
  // 閲覧できるチャンネルを検索・絞り込み・並べ替えしてページ単位で返す
  rpc SearchBrowsableChannels(SearchBrowsableChannelsRequest) returns (SearchBrowsableChannelsResponse);
}

message Channel {
  string id = 1;
  string workspace_id = 2;
  // スラッシュ区切りのフルパス (例: dev/frontend)
  string name = 3;
  optional string description = 4;
  bool is_private = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int32 unread_count = 9;
  optional string parent_id = 11;
  bool is_starred = 12;
  // false の場合はツリーを組み立てるために返している未参加の祖先チャンネル
  bool is_member = 13;
  bool is_muted = 15;
  // 最後のメッセージ（スレッドの返信を除く）の投稿日時。ListChannels でだけ設定する
  optional google.protobuf.Timestamp last_message_at = 16;
  // 未読のうち自分宛てのメンションの数。ミュート中でも数える
  int32 mention_count = 17;
}

message ListChannelsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message CreateChannelRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  // 存在しない親は自動で作成する
  string name = 2 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^[a-z0-9_-]{1,32}(/[a-z0-9_-]{1,32}){0,3}$"
  }];
  optional string description = 3;
  bool is_private = 4;
  // 作成者以外に参加させるユーザー
  repeated string member_ids = 5 [(buf.validate.field).repeated.items.string.uuid = true];
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetChannelResponse {
  Channel channel = 1;
}

message UpdateChannelRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  // 変更できるのは末尾のセグメントのみ
  optional string name = 2 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^[a-z0-9_-]{1,32}(/[a-z0-9_-]{1,32}){0,3}$"
  }];
  optional string description = 3;
  optional bool is_private = 4;
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message SetChannelStarredRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool starred = 2;
}

message SetChannelStarredResponse {}

message SetChannelMutedRequest {
  string channel_id = 1 [(buf.validate.field).string.uuid = true];
  bool muted = 2;
}

message SetChannelMutedResponse {}

message ListBrowsableChannelsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
}

message BrowsableChannel {
  Channel channel = 1;
  int32 member_count = 2;
}

message ListBrowsableChannelsResponse {
  repeated BrowsableChannel channels = 1;
}

enum BrowsableChannelMembership {
  // 参加の有無を問わない
  BROWSABLE_CHANNEL_MEMBERSHIP_UNSPECIFIED = 0;
  BROWSABLE_CHANNEL_MEMBERSHIP_JOINED = 1;
  BROWSABLE_CHANNEL_MEMBERSHIP_NOT_JOINED = 2;
}

enum BrowsableChannelSort {
  // 名前順
  BROWSABLE_CHANNEL_SORT_UNSPECIFIED = 0;
  // メンバーの多い順
  BROWSABLE_CHANNEL_SORT_MEMBER_COUNT = 1;
}

message SearchBrowsableChannelsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  // 名前と説明の部分一致。空ならすべて
  string query = 2 [(buf.validate.field).string.max_len = 100];
  BrowsableChannelMembership membership = 3 [(buf.validate.field).enum.defined_only = true];
  BrowsableChannelSort sort = 4 [(buf.validate.field).enum.defined_only = true];
  int32 page = 5 [(buf.validate.field).int32.gte = 1];
  int32 per_page = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}

message SearchBrowsableChannelsResponse {
  repeated BrowsableChannel channels = 1;
  // 条件に合うチャンネルの総数
  int32 total = 2;
}
