syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";

// ログイン中のユーザー自身の情報
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  optional string avatar_url = 4;
  optional string bio = 5;
  UserPreferences preferences = 6;
  // プロフィールに載せるリンクの URL
  repeated string links = 7;
}

// プロフィールに載せるリンク。表示名は持たず、主要なサイトはアイコンで見分ける
message ProfileLinks {
  repeated string urls = 1 [(buf.validate.field).repeated = {
    max_items: 5
    items: {
      string: {
        uri: true
        max_len: 2048
      }
      cel: {
        id: "http_url"
        message: "http(s) の URL を指定してください"
        expression: "this.startsWith('http://') || this.startsWith('https://')"
      }
    }
  }];
}

enum SidebarStyle {
  SIDEBAR_STYLE_UNSPECIFIED = 0;
  SIDEBAR_STYLE_TINTED = 1;
  SIDEBAR_STYLE_LIGHT = 2;
}

enum ColorMode {
  COLOR_MODE_UNSPECIFIED = 0;
  COLOR_MODE_LIGHT = 1;
  COLOR_MODE_DARK = 2;
  COLOR_MODE_SYSTEM = 3;
}

// サイドバーのチャンネルの並べ方。既定はツリーの名前順、最近は最新メッセージの新しい順でフラットに並べる
enum ChannelSortOrder {
  CHANNEL_SORT_ORDER_UNSPECIFIED = 0;
  CHANNEL_SORT_ORDER_DEFAULT = 1;
  CHANNEL_SORT_ORDER_RECENT_ACTIVITY = 2;
}

// 通知を受け取る範囲。すべて / メンションと DM のみ / なし
enum NotificationLevel {
  NOTIFICATION_LEVEL_UNSPECIFIED = 0;
  NOTIFICATION_LEVEL_ALL = 1;
  NOTIFICATION_LEVEL_MENTIONS = 2;
  NOTIFICATION_LEVEL_NONE = 3;
}

// テーマ入力。色は OKLCH の色相と彩度から計算する
message ThemePreference {
  int32 hue = 1 [(buf.validate.field).int32 = {
    gte: 0
    lt: 360
  }];
  double chroma = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 0.37
  }];
  SidebarStyle sidebar = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// 端末をまたいで共有する表示・通知の設定
message UserPreferences {
  ThemePreference theme = 1 [(buf.validate.field).required = true];
  ColorMode color_mode = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string locale = 3 [(buf.validate.field).string = {
    in: [
      "ja",
      "en"
    ]
  }];
  NotificationLevel notification_level = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // IANA のタイムゾーン名（例: Asia/Tokyo）。空は未設定。名前の正しさはサーバーで確かめる
  string timezone = 5 [(buf.validate.field).string.max_len = 64];
  // 端末のタイムゾーンが保存値と違うとき、尋ねずに更新する
  bool timezone_auto_update = 6;
  ChannelSortOrder channel_sort_order = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // チャンネルへの参加・追加のシステムメッセージを隠す
  bool hide_join_messages = 8;
}

// メッセージの投稿者などに埋め込む最小限のユーザー情報
message UserSummary {
  string id = 1;
  string display_name = 2;
  optional string avatar_url = 3;
  // アプリの投稿名義のボットユーザー。プロフィールを持たない
  bool is_bot = 4;
}
