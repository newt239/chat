syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "chat/v1/user.proto";

// Google ログインを主とし、パスワード認証は PASSWORD_AUTH_ENABLED のときだけ使える
service AuthService {
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // 未登録のメールアドレスは有効な招待があるか、登録を許可したワークスペースの参加リンクから来たときだけアカウントを作る
  rpc LoginWithGoogle(LoginWithGoogleRequest) returns (LoginWithGoogleResponse);
  // ネイティブアプリがブラウザで受け取った認可コードを PKCE で交換してログインする。アカウントの扱いは LoginWithGoogle と同じ
  rpc LoginWithGoogleCode(LoginWithGoogleCodeRequest) returns (LoginWithGoogleCodeResponse);
  // 招待リンクからパスワードを設定してアカウントを作る
  rpc SignUpWithInvitation(SignUpWithInvitationRequest) returns (SignUpWithInvitationResponse);
  // 登録とメールでの登録を許可したワークスペースの参加リンクからアカウントを作る
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message GetAuthConfigRequest {}

message GetAuthConfigResponse {
  bool password_auth_enabled = 1;
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string access_token = 1;
  // ネイティブアプリにだけ返す。ブラウザには httpOnly Cookie で渡す
  optional string refresh_token = 2;
  User user = 3;
}

message LoginWithGoogleRequest {
  // Google Identity Services が発行した ID トークン
  string id_token = 1 [(buf.validate.field).string.min_len = 1];
  // 参加リンクから来たときのワークスペース。登録を許可していれば、未参加のユーザーを参加させる
  optional string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
}

message LoginWithGoogleResponse {
  string access_token = 1;
  // ネイティブアプリにだけ返す。ブラウザには httpOnly Cookie で渡す
  optional string refresh_token = 2;
  User user = 3;
}

message LoginWithGoogleCodeRequest {
  string code = 1 [(buf.validate.field).string.min_len = 1];
  string code_verifier = 2 [(buf.validate.field).string = {
    min_len: 43
    max_len: 128
  }];
  // 認可リクエストに付けた nonce。ID トークンの nonce と一致しなければ拒否する
  string nonce = 3 [(buf.validate.field).string.min_len = 1];
  optional string workspace_id = 4 [(buf.validate.field).string.min_len = 1];
}

message LoginWithGoogleCodeResponse {
  string access_token = 1;
  // ネイティブアプリにだけ返す。ブラウザには httpOnly Cookie で渡す
  optional string refresh_token = 2;
  User user = 3;
}

message SignUpWithInvitationRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
  string display_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string password = 3 [(buf.validate.field).string.min_len = 8];
}

message SignUpWithInvitationResponse {
  string access_token = 1;
  // ネイティブアプリにだけ返す。ブラウザには httpOnly Cookie で渡す
  optional string refresh_token = 2;
  User user = 3;
}

message SignUpRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string email = 2 [(buf.validate.field).string.email = true];
  string display_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string password = 4 [(buf.validate.field).string.min_len = 8];
}

message SignUpResponse {
  string access_token = 1;
  // ネイティブアプリにだけ返す。ブラウザには httpOnly Cookie で渡す
  optional string refresh_token = 2;
  User user = 3;
}

message RefreshRequest {
  // ネイティブアプリだけが送る。ブラウザは Cookie を使う
  optional string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshResponse {
  string access_token = 1;
  // ネイティブアプリにだけ返す。ブラウザには httpOnly Cookie で渡す
  optional string refresh_token = 2;
  User user = 3;
}

message LogoutRequest {}

message LogoutResponse {}
