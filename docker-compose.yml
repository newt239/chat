services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1::5432"
    volumes:
      # PostgreSQL 18 以降は /data ではなくこの階層をマウントする
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - chat-network
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.54
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: development-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1::7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chat-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # WebSocket の配信などに使うだけなので永続化しない
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chat-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/chat?sslmode=disable
      - JWT_SECRET=development-secret-key
      - CORS_ALLOWED_ORIGINS=${CHAT_CORS_ORIGINS:-},tauri://localhost,https://tauri.localhost
      # 添付ファイルや絵文字は Wasabi ではなく backend/tmp/storage に保存し、backend の /storage から配信する
      - STORAGE_DRIVER=local
      - PUBLIC_BASE_URL=${CHAT_API_URL:-}
      # seed のメッセージリンクに使うフロントの URL
      - APP_URL=${CHAT_APP_URL:-}
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=development-master-key
      - REDIS_URL=redis://redis:6379
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URL=${GOOGLE_OAUTH_REDIRECT_URL:-}
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./backend:/app
      - backend_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      - VITE_API_BASE_URL=${CHAT_API_URL:-}
      - VITE_WS_URL=${CHAT_WS_URL:-}
      - VITE_GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - "127.0.0.1::5173"
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./package.json:/app/package.json:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - chat-network
    restart: unless-stopped

volumes:
  postgres_data:
  meilisearch_data:
  backend_cache:
  frontend_node_modules:

networks:
  chat-network:
    driver: bridge
